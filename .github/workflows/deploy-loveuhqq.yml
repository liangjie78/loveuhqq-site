name: Deploy loveuhqq

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-loveuhqq
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy loveuhqq.x23.shop
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production bindings
        run: node scripts/check-production-config.mjs

      - name: Build site
        run: npm run build

      - name: Check required D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler d1 execute DB --remote --json
          --command "SELECT (SELECT revision FROM album_state LIMIT 0), (SELECT revision FROM memory_change LIMIT 0), (SELECT created_at FROM memory_audio LIMIT 0)"

      - name: Check that the build is still the tip of main
        id: current
        shell: bash
        run: |
          remote=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ $(git rev-parse HEAD) == "${remote%%$'\t'*}" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deploy because main has advanced.'
          fi

      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy
