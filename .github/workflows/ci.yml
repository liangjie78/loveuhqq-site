name: CI

# "Deploy loveuhqq" waits for this workflow by name; keep the name as it is.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Worker types
        run: npm run check:worker

      - name: Check frontend types
        run: npm run check:frontend

      - name: Unit and Worker tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Check the built site
        run: npm run test:build

      - name: Keep the build for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  browser:
    name: Browser tests (desktop and phone)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch the build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run Playwright against a local Worker
        run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
